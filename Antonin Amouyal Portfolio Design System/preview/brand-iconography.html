<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>
.grid { display:grid; grid-template-columns:repeat(8,1fr); gap:10px; }
.ic { aspect-ratio:1; background:#f3f4f6; border-radius:8px; display:flex; align-items:center; justify-content:center; color:#2563eb; font-size:18px; }
.note { margin-top:12px; font-size:11px; color:var(--fg-2); line-height:1.55; }
.note code { background:#f3f4f6; padding:2px 6px; border-radius:4px; font-size:11px; }
</style></head><body>
<div class="card">
<p class="hlabel">Iconography — Font Awesome 6 only</p>
<div class="grid">
  <div class="ic"><i class="fa-brands fa-python"></i></div>
  <div class="ic"><i class="fa-brands fa-angular"></i></div>
  <div class="ic"><i class="fa-brands fa-aws"></i></div>
  <div class="ic"><i class="fa-brands fa-docker"></i></div>
  <div class="ic"><i class="fa-brands fa-linkedin"></i></div>
  <div class="ic"><i class="fa-brands fa-github"></i></div>
  <div class="ic"><i class="fa-brands fa-youtube"></i></div>
  <div class="ic"><i class="fa-brands fa-html5"></i></div>
  <div class="ic"><i class="fa-solid fa-database"></i></div>
  <div class="ic"><i class="fa-solid fa-microphone"></i></div>
  <div class="ic"><i class="fa-solid fa-heartbeat"></i></div>
  <div class="ic"><i class="fa-solid fa-balance-scale"></i></div>
  <div class="ic"><i class="fa-solid fa-table"></i></div>
  <div class="ic"><i class="fa-solid fa-chart-line"></i></div>
  <div class="ic"><i class="fa-solid fa-robot"></i></div>
  <div class="ic"><i class="fa-solid fa-fire"></i></div>
</div>
<p class="note">Font Awesome 6.0.0 via <code>cdnjs</code>. Mix of <code>fa-brands</code> for tech logos and <code>fa-solid</code> for domain icons. No emoji, no hand-rolled SVG.</p>
</div>
</body></html>
