<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>
.btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:.75rem 1.5rem; border-radius:.5rem; font-weight:500; font-family:var(--font-sans); font-size:14px; min-width:140px; cursor:pointer; text-decoration:none; }
.btn-primary { background:#2563eb; color:#fff; border:none; }
.btn-secondary { background:transparent; color:#2563eb; border:1px solid #2563eb; }
.btn-primary:hover { background:#1e40af; }
.btn-secondary:hover { background:rgba(37,99,235,0.1); }
.stack { display:flex; flex-direction:column; gap:18px; }
.row2 { display:flex; gap:12px; }
.lbl { font-size:10px; color:var(--fg-2); font-family:ui-monospace,monospace; letter-spacing:0.05em; text-transform:uppercase; margin-top:8px; }
</style></head><body>
<div class="card">
<p class="hlabel">Buttons — primary &amp; secondary (current)</p>
<div class="stack">
  <div><div class="row2"><a class="btn btn-primary"><i class="fas fa-envelope"></i> Me contacter</a><a class="btn btn-secondary">Voir mes travaux</a></div><div class="lbl">default · 45px min-height</div></div>
  <div><div class="row2"><a class="btn btn-primary" style="background:#1e40af">Me contacter</a><a class="btn btn-secondary" style="background:rgba(37,99,235,0.1)">Voir mes travaux</a></div><div class="lbl">:hover · primary darkens to secondary, ghost gets 10% wash</div></div>
</div>
</div>
</body></html>
