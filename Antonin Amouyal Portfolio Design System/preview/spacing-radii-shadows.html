<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.grid { display:grid; grid-template-columns: repeat(3,1fr); gap:14px; }
.demo { background:#fff; height:84px; display:flex; align-items:center; justify-content:center; font-family:ui-monospace,monospace; font-size:11px; color:var(--fg-2); }
.lbl { margin-top:6px; font-size:10px; color:var(--fg-2); font-family:ui-monospace,monospace; letter-spacing:0.05em; }
</style></head><body>
<div class="card">
<p class="hlabel">Radii &amp; shadow tiers</p>
<div class="grid">
  <div><div class="demo" style="border-radius:0.25rem;box-shadow:0 1px 3px rgba(0,0,0,.1)">radius-sm · 4px</div><div class="lbl">shadow-sm · nav, tags</div></div>
  <div><div class="demo" style="border-radius:0.5rem;box-shadow:0 4px 6px rgba(0,0,0,.1)">radius-md · 8px</div><div class="lbl">shadow-md · cards rest</div></div>
  <div><div class="demo" style="border-radius:1rem;box-shadow:0 10px 15px rgba(0,0,0,.1)">radius-lg · 16px</div><div class="lbl">shadow-lg · cards hover</div></div>
  <div><div class="demo" style="border-radius:2rem;background:rgba(37,99,235,0.1);color:#2563eb">pill · 32px</div><div class="lbl">radius-pill · tags</div></div>
  <div><div class="demo" style="border-radius:50%;width:84px;margin:0 auto;border:4px solid #2563eb;box-shadow:0 5px 15px rgba(0,0,0,.2)">round</div><div class="lbl">circle · profile photo</div></div>
  <div><div class="demo" style="border-radius:0.5rem;box-shadow:0 8px 15px rgba(37,99,235,.2);color:#2563eb">shadow-accent</div><div class="lbl">hover — libraries stack</div></div>
</div>
</div>
</body></html>
