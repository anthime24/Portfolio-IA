<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.row { display:flex; gap:20px; align-items:center; }
.pic { width:160px; height:160px; border-radius:50%; border:4px solid #2563eb; background:url('../assets/antonin_photo.png') center 20%/cover; box-shadow:0 5px 15px rgba(0,0,0,.2); }
.pic.hv { transform:translateY(-5px); border-color:#1e40af; box-shadow:0 10px 15px rgba(0,0,0,.1); }
.notes { font-size:12px; color:var(--fg-2); line-height:1.55; flex:1; }
.notes b { color:var(--fg-1); }
</style></head><body>
<div class="card">
<p class="hlabel">Profile photo — about-section portrait</p>
<div class="row">
  <div class="pic"></div>
  <div class="pic hv"></div>
  <div class="notes"><b>Spec:</b> 300×300 (displayed 160 here), perfect circle, 4px primary border, <code>object-position:center 20%</code> for tight head crop. <br><br><b>Hover:</b> translateY(-5px), border shifts to secondary blue, shadow upgrades to <code>--shadow-lg</code>.</div>
</div>
</div>
</body></html>
