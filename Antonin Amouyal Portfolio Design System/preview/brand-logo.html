<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.bg { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
.sq { aspect-ratio:1; border-radius:10px; display:flex; align-items:center; justify-content:center; }
.sq img { width:60%; height:60%; object-fit:contain; }
.lbl { text-align:center; font-size:10px; color:var(--fg-2); font-family:ui-monospace,monospace; letter-spacing:0.05em; text-transform:uppercase; margin-top:6px; }
</style></head><body>
<div class="card">
<p class="hlabel">Logo — primary mark, used 70×70 in nav</p>
<div class="bg">
  <div><div class="sq" style="background:#fff;box-shadow:inset 0 0 0 1px rgba(0,0,0,0.08)"><img src="../assets/logo_portfolio.png"></div><div class="lbl">on paper</div></div>
  <div><div class="sq" style="background:#f3f4f6"><img src="../assets/logo_portfolio.png"></div><div class="lbl">on section</div></div>
  <div><div class="sq" style="background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%)"><img src="../assets/logo_portfolio.png"></div><div class="lbl">on hero</div></div>
</div>
</div>
</body></html>
