<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
@font-face { font-family: 'Exon'; src: url('../fonts/Exon_Regular.otf') format('opentype'); font-weight: 400; font-display: swap; }
.hero-blk { background: linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%); border-radius: 10px; padding: 18px 22px; }
.greet { font-family: 'Poppins'; font-weight: 600; font-size: 32px; line-height: 1.15; color: #1f2937; letter-spacing: -0.01em; }
.greet .name { font-family: 'Exon', serif; font-weight: 400; letter-spacing: 0.005em; }
.note { font-family: 'Poppins'; font-size: 11px; color: #6b7280; letter-spacing: .08em; text-transform: uppercase; margin-top: 6px; }
</style></head><body>
<div class="card">
<p class="hlabel">Hero headline — Poppins 600 intro + Exon accent on the name</p>
<div class="hero-blk">
  <div class="greet">Hi, I'm <span class="name">Antonin Amouyal</span></div>
  <div class="note">Poppins 600 · 32px  ·  <span style="font-family:'Exon',serif">Exon</span> 400 — brand accent</div>
</div>
<p class="meta" style="margin-top:12px;color:#6b7280;font-family:'Poppins';font-size:12px;">Exon is used <b>only</b> on the logo mark &amp; hero name. Everything else stays Poppins.</p>
</div>
</body></html>
