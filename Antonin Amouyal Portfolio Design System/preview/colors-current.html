<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.card { padding: 24px; }
.palette { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.sw { aspect-ratio: 1; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between; font-family: ui-monospace, monospace; font-size: 10px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06); }
.sw .n { font-family: var(--font-sans); font-size: 11px; font-weight: 600; }
</style></head><body>
<div class="card">
<p class="hlabel">Current — live portfolio palette</p>
<div class="palette">
  <div class="sw" style="background:#2563eb;color:#fff"><span class="n">primary</span><span>#2563EB</span></div>
  <div class="sw" style="background:#1e40af;color:#fff"><span class="n">secondary</span><span>#1E40AF</span></div>
  <div class="sw" style="background:#1f2937;color:#fff"><span class="n">text</span><span>#1F2937</span></div>
  <div class="sw" style="background:#6b7280;color:#fff"><span class="n">light-text</span><span>#6B7280</span></div>
  <div class="sw" style="background:#f3f4f6;color:#1f2937"><span class="n">section-bg</span><span>#F3F4F6</span></div>
  <div class="sw" style="background:#ffffff;color:#1f2937"><span class="n">background</span><span>#FFFFFF</span></div>
</div>
</div>
</body></html>
