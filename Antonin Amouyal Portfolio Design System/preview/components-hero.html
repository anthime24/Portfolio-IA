<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"><style>
.hero { background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%); border-radius:12px; padding:40px 32px; position:relative; overflow:hidden; }
.g { font-family:var(--font-sans); font-weight:600; font-size:32px; margin:0 0 8px; }
.g::after { content:'|'; font-weight:300; opacity:.6; margin-left:2px; }
.j { font-family:var(--font-sans); font-weight:500; font-size:18px; color:#2563eb; margin:0 0 8px; }
.loc { font-size:13px; color:#6b7280; margin:0 0 20px; }
.cta { display:flex; gap:10px; }
.btn { padding:10px 18px; border-radius:8px; font-size:13px; font-weight:500; font-family:var(--font-sans); }
.btn-primary { background:#2563eb; color:#fff; }
.btn-ghost { background:transparent; color:#2563eb; border:1px solid #2563eb; }
.ic { position:absolute; color:#2563eb; opacity:.35; }
</style></head><body>
<div class="card">
<p class="hlabel">Hero — current composition</p>
<div class="hero">
  <i class="ic fa-brands fa-python" style="top:18px;right:60px;font-size:28px"></i>
  <i class="ic fa-brands fa-docker" style="top:50px;right:130px;font-size:22px;opacity:.25"></i>
  <i class="ic fa-solid fa-database" style="bottom:30px;right:40px;font-size:20px;opacity:.3"></i>
  <i class="ic fa-brands fa-aws" style="bottom:60px;right:160px;font-size:24px;opacity:.25"></i>
  <h1 class="g">Hi, I'm Antonin Amouyal</h1>
  <h2 class="j">AI &amp; Data Student</h2>
  <p class="loc"><i class="fas fa-map-marker-alt" style="color:#6b7280"></i> Paris, France</p>
  <div class="cta"><a class="btn btn-primary">Contact Me</a><a class="btn btn-ghost">View My Work</a></div>
</div>
</div>
</body></html>
