<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"><style>
.nav { height:80px; background:rgba(255,255,255,0.95); backdrop-filter:blur(10px); box-shadow:0 1px 3px rgba(0,0,0,.1); display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:24px; padding:0 24px; }
.logo { width:50px; height:50px; border-radius:50%; background:url('../assets/logo_portfolio.png') center/cover; }
.nav ul { display:flex; gap:2rem; list-style:none; margin:0; padding:0; }
.nav a { color:#1f2937; text-decoration:none; font-size:14px; font-family:var(--font-sans); }
.lang { display:flex; gap:.5rem; }
.lb { background:none; border:1px solid transparent; padding:.25rem .5rem; font-size:.875rem; font-weight:500; border-radius:.25rem; cursor:pointer; font-family:var(--font-sans); }
.lb.active { border-color:#2563eb; color:#2563eb; }
.bg { background:linear-gradient(135deg,#f0f9ff 0%,#e0f2fe 100%); height:40px; }
</style></head><body>
<div class="card" style="padding:0 24px 24px;">
<p class="hlabel" style="margin-top:24px">Navbar — fixed, 80px, blur(10px)</p>
<div style="border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)">
  <div class="nav">
    <div class="logo"></div>
    <ul><li><a>About</a></li><li><a>Projects</a></li><li><a>Tech Stack</a></li><li><a>Contact</a></li></ul>
    <div class="lang"><button class="lb active">EN</button><button class="lb">FR</button></div>
    <div></div>
  </div>
  <div class="bg"></div>
</div>
</div>
</body></html>
