<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Portfolio — Antonin Amouyal (Print)</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
<link rel="stylesheet" href="styles.css">
<style>
  /* Disable all interactive chrome for print */
  .pf-progress, .pf-cursor, .tweaks, .pf-modal-overlay { display: none !important; }
  body.pf-has-cursor, body.pf-has-cursor * { cursor: auto !important; }

  /* Flatten animations and reveal state */
  * { animation: none !important; transition: none !important; }
  .pf-title-underline path { stroke-dashoffset: 0 !important; }
  .pf-float-icon { opacity: .35 !important; animation: none !important; }
  .pf-cursor-blink, .pf-job-caret { display: none !important; }

  /* Print rules */
  @media print {
    @page { size: A4 portrait; margin: 12mm; }
    html, body { background: #fff !important; color: #111 !important; }
    body { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .pf-nav { position: static !important; box-shadow: none !important; }
    section { break-inside: avoid; page-break-inside: avoid; padding: 2.5rem 0 !important; }
    .pf-hero { min-height: auto !important; padding: 3rem 0 !important; }
    .pf-projects-grid { grid-template-columns: 1fr 1fr !important; gap: 1rem !important; }
    .pf-project-card { break-inside: avoid; page-break-inside: avoid; box-shadow: 0 0 0 1px rgba(0,0,0,.12) !important; }
    .pf-tech-groups { grid-template-columns: repeat(3, 1fr) !important; gap: 1rem !important; }
    .pf-projects, .pf-tech, .pf-contact, .pf-about { break-before: page; }
    .pf-hero { break-after: page; }
    .pf-footer { background: #222 !important; }
    a { color: inherit !important; text-decoration: none !important; }
  }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="data.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Components.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;

function PrintApp() {
  useEffect(() => { document.body.classList.remove('pf-dark'); }, []);
  return (
    <>
      <Navbar lang="en" setLang={()=>{}} theme="light" setTheme={()=>{}} />
      <Hero />
      <About />
      <Projects onOpen={()=>{}} />
      <TechStack />
      <Contact />
      <Footer />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<PrintApp />);

// Auto-print once fonts + Babel + assets are settled
(async () => {
  try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch(e){}
  await new Promise(r => setTimeout(r, 1200));
  window.print();
})();
</script>
</body>
</html>
