  <circle cx="342" cy="52" r="4" fill="#4ade80" opacity="0.75"></circle>
  <circle cx="354" cy="60" r="3" fill="#4ade80" opacity="0.7"></circle>
  <!-- water ripple -->
  <ellipse cx="348" cy="56" rx="8" ry="5" fill="none" stroke="#0ea5e9" stroke-width="0.7" opacity="0.5"></ellipse>

  <!-- BOTTOM ZONE -->

  <!-- Shrubs row (bottom left) -->
  <circle cx="40"  cy="148" r="12" fill="#15803d" opacity="0.8"></circle>
  <circle cx="40"  cy="148" r="7"  fill="#16a34a" opacity="0.5"></circle>
  <circle cx="68"  cy="150" r="10" fill="#15803d" opacity="0.75"></circle>
  <circle cx="92"  cy="147" r="13" fill="#15803d" opacity="0.8"></circle>
  <circle cx="92"  cy="147" r="7"  fill="#16a34a" opacity="0.45"></circle>
  <circle cx="118" cy="150" r="9"  fill="#15803d" opacity="0.7"></circle>

