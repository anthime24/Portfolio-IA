  <line x1="150" y1="141" x2="240" y2="141" stroke="#b45309" stroke-width="0.7" opacity="0.4"></line>
  <line x1="150" y1="160" x2="240" y2="160" stroke="#b45309" stroke-width="0.7" opacity="0.4"></line>
