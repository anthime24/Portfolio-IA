<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky5" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0fdf4"></stop>
      <stop offset="1" stop-color="#dcfce7"></stop>
    </linearGradient>
    <pattern id="grass5" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <line x1="2" y1="8" x2="4" y2="4" stroke="#86efac" stroke-width="0.7" stroke-linecap="round"></line>
      <line x1="6" y1="8" x2="5" y2="5" stroke="#86efac" stroke-width="0.7" stroke-linecap="round"></line>
    </pattern>
  </defs>

  <!-- Background lawn -->
  <rect width="400" height="200" fill="url(#sky5)"></rect>
  <rect width="400" height="200" fill="url(#grass5)" opacity="0.6"></rect>

  <!-- Garden border -->
  <rect x="18" y="18" width="364" height="164" rx="4" fill="none" stroke="#1f2937" stroke-width="1.5" stroke-dasharray="6 3"></rect>

  <!-- Stone path (horizontal) -->
  <rect x="18" y="90" width="364" height="20" rx="0" fill="#f5f5f4" opacity="0.75"></rect>
  <rect x="32"  y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="68"  y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="104" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="140" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="176" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="212" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="248" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="284" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="320" y="93" width="28" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>
  <rect x="356" y="93" width="26" height="14" rx="2" fill="#e7e5e4" stroke="#d6d3d1" stroke-width="0.6"></rect>

  <!-- TOP ZONE -->

  <!-- Tree 1 (big) -->
  <circle cx="60" cy="54" r="22" fill="#16a34a" opacity="0.85"></circle>
  <circle cx="60" cy="54" r="14" fill="#15803d" opacity="0.6"></circle>
  <circle cx="54" cy="49" r="6" fill="#22c55e" opacity="0.4"></circle>
  <rect x="57" y="73" width="6" height="12" fill="#92400e"></rect>

  <!-- Tree 2 (medium) -->
  <circle cx="160" cy="58" r="16" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="160" cy="58" r="9" fill="#15803d" opacity="0.5"></circle>
  <circle cx="155" cy="54" r="5" fill="#22c55e" opacity="0.35"></circle>
  <rect x="157" y="72" width="5" height="11" fill="#92400e"></rect>

