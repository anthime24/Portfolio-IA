  <circle cx="165" cy="132" r="3.5" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="180" cy="132" r="3.5" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="195" cy="132" r="3.5" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="210" cy="132" r="3.5" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="225" cy="132" r="3.5" fill="#16a34a" opacity="0.8"></circle>
  <circle cx="165" cy="151" r="3.5" fill="#16a34a" opacity="0.7"></circle>
  <circle cx="180" cy="151" r="3.5" fill="#16a34a" opacity="0.7"></circle>
  <circle cx="195" cy="151" r="3.5" fill="#16a34a" opacity="0.7"></circle>
  <circle cx="210" cy="151" r="3.5" fill="#16a34a" opacity="0.7"></circle>
  <circle cx="225" cy="151" r="3.5" fill="#16a34a" opacity="0.7"></circle>
  <circle cx="165" cy="169" r="3.5" fill="#16a34a" opacity="0.65"></circle>
  <circle cx="180" cy="169" r="3.5" fill="#16a34a" opacity="0.65"></circle>
  <circle cx="195" cy="169" r="3.5" fill="#16a34a" opacity="0.65"></circle>
  <circle cx="210" cy="169" r="3.5" fill="#16a34a" opacity="0.65"></circle>
  <circle cx="225" cy="169" r="3.5" fill="#16a34a" opacity="0.65"></circle>

  <!-- AI badge (bottom right) -->
  <rect x="268" y="124" width="96" height="54" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.2" opacity="0.95"></rect>
  <text x="316" y="143" font-family="ui-monospace, monospace" font-size="7" fill="#1d4ed8" text-anchor="middle" font-weight="bold">AI-generated</text>
  <text x="316" y="155" font-family="ui-monospace, monospace" font-size="6.5" fill="#6b7280" text-anchor="middle">layout plan</text>
  <!-- small ai icon: brain outline -->
  <ellipse cx="316" cy="168" rx="7" ry="5" fill="none" stroke="#2563eb" stroke-width="1.1"></ellipse>
  <line x1="309" y1="168" x2="313" y2="168" stroke="#2563eb" stroke-width="0.9"></line>
  <line x1="319" y1="168" x2="323" y2="168" stroke="#2563eb" stroke-width="0.9"></line>
  <line x1="316" y1="163" x2="316" y2="160" stroke="#2563eb" stroke-width="0.9"></line>
</svg>
