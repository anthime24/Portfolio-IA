  <line x1="256" y1="50" x2="256" y2="68" stroke="#16a34a" stroke-width="1" stroke-linecap="round"></line>
  <line x1="270" y1="57" x2="270" y2="68" stroke="#16a34a" stroke-width="1" stroke-linecap="round"></line>
  <line x1="248" y1="66" x2="248" y2="68" stroke="#16a34a" stroke-width="1" stroke-linecap="round"></line>
  <line x1="278" y1="64" x2="278" y2="68" stroke="#16a34a" stroke-width="1" stroke-linecap="round"></line>
  <line x1="263" y1="67" x2="263" y2="68" stroke="#16a34a" stroke-width="1" stroke-linecap="round"></line>
  <!-- border -->
  <rect x="224" y="66" width="72" height="6" rx="2" fill="#a16207" opacity="0.35"></rect>

  <!-- Pond (top right) -->
  <ellipse cx="348" cy="56" rx="26" ry="20" fill="#bae6fd" stroke="#0284c7" stroke-width="1.2" opacity="0.9"></ellipse>
  <ellipse cx="348" cy="56" rx="14" ry="10" fill="#7dd3fc" opacity="0.5"></ellipse>
