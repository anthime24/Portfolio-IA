<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wash4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
    <pattern id="dots4" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="1.2" cy="1.2" r="0.8" fill="#2563eb" opacity="0.18"/>
    </pattern>
    <marker id="arrowhead4" markerWidth="6" markerHeight="4" refX="6" refY="2" orient="auto">
      <polygon points="0 0, 6 2, 0 4" fill="#2563eb" opacity="0.7"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="400" height="200" fill="url(#wash4)"/>
  <rect width="400" height="200" fill="url(#dots4)"/>

  <!-- LinkedIn card (source) -->
  <rect x="28" y="60" width="88" height="80" rx="6" fill="#fff" stroke="#2563eb" stroke-width="1.4" opacity="0.9"/>
  <!-- Avatar circle -->
  <circle cx="60" cy="88" r="14" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1.2"/>
  <circle cx="60" cy="84" r="6" fill="#2563eb" opacity="0.4"/>
  <path d="M46 100 Q46 96 60 96 Q74 96 74 100" fill="#2563eb" opacity="0.3" stroke="none"/>
  <!-- Name lines -->
  <rect x="78" y="82" width="30" height="3" rx="1.5" fill="#1f2937" opacity="0.3"/>
  <rect x="78" y="89" width="22" height="2.5" rx="1.25" fill="#1f2937" opacity="0.2"/>
  <!-- Post text lines -->
  <rect x="36" y="110" width="72" height="2.5" rx="1.25" fill="#1f2937" opacity="0.2"/>
  <rect x="36" y="116" width="60" height="2.5" rx="1.25" fill="#1f2937" opacity="0.2"/>
  <rect x="36" y="122" width="44" height="2.5" rx="1.25" fill="#1f2937" opacity="0.2"/>
  <!-- Like icon -->
  <path d="M36 133 L40 129 L42 131 L46 126 L50 133 Z" fill="#2563eb" opacity="0.5"/>
  <text x="54" y="134" font-family="ui-monospace,monospace" font-size="8" fill="#2563eb" opacity="0.7">247</text>

  <!-- Arrow: LinkedIn -> Python scraper -->
  <line x1="118" y1="100" x2="148" y2="100" stroke="#2563eb" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#arrowhead4)" opacity="0.7"/>

  <!-- Python scraper box -->
  <rect x="152" y="78" width="70" height="44" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.2" opacity="0.85"/>
  <text x="162" y="96" font-family="ui-monospace,monospace" font-size="9" fill="#2563eb" opacity="0.9">scraper.py</text>
  <!-- Animated-looking lines -->
  <rect x="160" y="101" width="54" height="2" rx="1" fill="#1f2937" opacity="0.12"/>
  <rect x="160" y="106" width="42" height="2" rx="1" fill="#2563eb" opacity="0.18"/>
  <rect x="160" y="111" width="48" height="2" rx="1" fill="#1f2937" opacity="0.12"/>

  <!-- Arrow: Scraper -> Flask -->
  <line x1="224" y1="100" x2="252" y2="100" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowhead4)" opacity="0.7"/>

  <!-- Flask API -->
  <rect x="256" y="78" width="58" height="44" rx="5" fill="#fff" stroke="#2563eb" stroke-width="1.2" opacity="0.85"/>
  <text x="264" y="96" font-family="ui-monospace,monospace" font-size="9" fill="#2563eb" opacity="0.9">Flask</text>
  <text x="262" y="109" font-family="ui-monospace,monospace" font-size="7.5" fill="#1f2937" opacity="0.5">API + DB</text>
  <!-- Plug icon -->
  <circle cx="285" cy="116" r="5" fill="none" stroke="#2563eb" stroke-width="1.2" opacity="0.6"/>
  <line x1="285" y1="121" x2="285" y2="115" stroke="#2563eb" stroke-width="1" opacity="0.6"/>

  <!-- Arrow: Flask -> PostgreSQL -->
  <line x1="316" y1="100" x2="342" y2="100" stroke="#2563eb" stroke-width="1.4" marker-end="url(#arrowhead4)" opacity="0.7"/>

  <!-- PostgreSQL cylinder -->
  <ellipse cx="360" cy="86" rx="18" ry="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1.3"/>
  <rect x="342" y="86" width="36" height="30" fill="#2563eb" opacity="0.08" stroke="#2563eb" stroke-width="1.3"/>
  <ellipse cx="360" cy="116" rx="18" ry="6" fill="#2563eb" opacity="0.15" stroke="#2563eb" stroke-width="1.3"/>
  <text x="349" y="104" font-family="ui-monospace,monospace" font-size="7.5" fill="#2563eb" opacity="0.8">psql</text>

  <!-- Data rows below -->
  <g font-family="ui-monospace,monospace" font-size="7.5" fill="#1f2937" opacity="0.55">
    <text x="30" y="158">profile_id</text>
    <text x="100" y="158">likes</text>
    <text x="140" y="158">comments</text>
    <text x="210" y="158">score</text>
    <line x1="28" y1="161" x2="280" y2="161" stroke="#2563eb" stroke-width="0.6" opacity="0.3"/>
    <text x="30" y="172" opacity="0.4">usr_4821</text>
    <text x="100" y="172" opacity="0.4">247</text>
    <text x="140" y="172" opacity="0.4">38</text>
    <text x="210" y="172" opacity="0.4">0.91</text>
  </g>
</svg>
